<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora - İletişim</title>
  <!-- Harici CSS bağlama -->
  <link rel="stylesheet" href="css/iletisim.css" />
</head>
<body>
  <header>
    <h1>Aurora - İletişim</h1>
  </header>

  <main>
    <section class="iletisim-formu">
      <form id="contactForm" action="#" method="post" novalidate>
        <label for="isim">İsim Soyisim</label>
        <input type="text" id="isim" name="isim" placeholder="Adınız Soyadınız" required />

        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com" required />

        <label for="konu">Konu</label>
        <input type="text" id="konu" name="konu" placeholder="Mesaj konusu" required />

        <label for="mesaj">Mesajınız</label>
        <textarea id="mesaj" name="mesaj" placeholder="Mesajınızı buraya yazınız..." required></textarea>

        <button type="submit">Gönder</button>
      </form>
    </section>

    <section class="map-container">
      <h3>Konumumuz</h3>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3047.1625020971087!2d28.978358615182083!3d41.00823707930362!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caba37715f133f%3A0xf87c2d4862335ac7!2sSultanahmet%2C%20Istanbul%2C%20Turkey!5e0!3m2!1str!2str!4v1615540800973!5m2!1str!2str" 
        width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactForm');
      const main = document.querySelector('main');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const isim = form.isim.value.trim();
        const email = form.email.value.trim();
        const konu = form.konu.value.trim();
        const mesaj = form.mesaj.value.trim();

        if (!isim || !email || !konu || !mesaj) {
          alert('Lütfen tüm alanları doldurunuz.');
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          alert('Lütfen geçerli bir e-posta adresi giriniz.');
          return;
        }

        // Form başarılı gönderilince teşekkür mesajı göster
        form.reset();
        main.innerHTML = `
          <section class="tesekkur-mesaji" style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(249, 167, 193, 0.2); text-align: center;">
            <h2>Teşekkürler!</h2>
            <p>Mesajınız bize ulaştı. En kısa zamanda sizinle iletişime geçeceğiz.</p>
            <button onclick="location.reload()">Yeni Mesaj Gönder</button>
          </section>
        `;
      });
    });
  </script>
</body>
</html>
