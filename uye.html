<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora - Üye Ol</title>
  <link rel="stylesheet" href="css/uye.css" />
</head>
<body>
  <header>
    <h1>Aurora - Üye Kayıt</h1>
  </header>

  <main>
    <section class="uye-formu">
      <form id="registerForm" novalidate>
        <label for="isim">İsim Soyisim</label>
        <input type="text" id="isim" name="isim" placeholder="Adınız Soyadınız" required />

        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com" required />

        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" name="sifre" placeholder="Şifreniz" required minlength="6" />

        <label for="sifreTekrar">Şifre Tekrar</label>
        <input type="password" id="sifreTekrar" name="sifreTekrar" placeholder="Şifrenizi tekrar giriniz" required minlength="6" />

        <button type="submit">Kayıt Ol</button>
      </form>
    </section>
  </main>

  <script src="uye.js"></script>
</body>
</html>
